# LiteLLM proxy + Postgres for the CyberGym-E2E Codex arm.
#
# The official run_agent.py mints a per-task budget key against this proxy
# (POST /key/generate with max_budget), and the agent container routes its
# OpenAI calls through it. Postgres is required for budget keys to persist.
#
# Start:   ./up.sh        (reads reproduce/litellm/.env for the keys/prices)
# The proxy listens on ${LITELLM_PORT:-4000}. From an agent container it is
# reached at http://<docker-bridge-gateway>:<port> (see up.sh / REPRODUCE.md).
services:
  litellm-db:
    image: postgres:16
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm}
    volumes:
      - litellm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 5s
      timeout: 5s
      retries: 20

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    depends_on:
      litellm-db:
        condition: service_healthy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY in reproduce/litellm/.env}
      DATABASE_URL: postgresql://litellm:${POSTGRES_PASSWORD:-litellm}@litellm-db:5432/litellm
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in reproduce/litellm/.env}
      # gpt-5 token prices (USD per token) used for per-task $ budget accounting.
      # Override in .env to match current OpenAI pricing; defaults are placeholders.
      GPT5_INPUT_COST_PER_TOKEN: ${GPT5_INPUT_COST_PER_TOKEN:-0.00000125}
      GPT5_OUTPUT_COST_PER_TOKEN: ${GPT5_OUTPUT_COST_PER_TOKEN:-0.00001000}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]

volumes:
  litellm_pgdata:
